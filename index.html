<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMAI 3D SNAKE - AI & VOICE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Assistant', sans-serif; touch-action: none; }
        canvas { display: block; }
        .ui-panel { position: fixed; z-index: 100; pointer-events: none; }
        .glass { background: rgba(0, 20, 0, 0.8); backdrop-filter: blur(12px); border: 1px solid #0f0; pointer-events: auto; color: #0f0; }
        .speaking-indicator { width: 12px; height: 12px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 5px; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="ui-panel top-4 right-4 glass p-4 rounded-xl text-white w-64">
        <h2 class="text-xl font-bold mb-2 text-green-400 border-b border-green-900 pb-1 text-center">SMAI - שחקנים</h2>
        <div id="players-list" class="space-y-2 text-sm text-green-500">
            </div>
    </div>

    <div class="ui-panel bottom-4 right-4 flex gap-4">
        <button id="mic-toggle" class="glass p-4 rounded-full hover:bg-green-900 transition-all shadow-lg">
            <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
    </div>

    <video id="hand-video" class="hidden" autoplay playsinline muted></video>
    <video id="webcam-preview" class="fixed bottom-4 left-4 w-40 h-32 rounded-xl border-2 border-green-500 transform scaleX(-1) object-cover z-50" autoplay playsinline muted></video>

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously } from "firebase/auth";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc, serverTimestamp } from "firebase/firestore";
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        // --- Firebase Config - תכניס את הפרטים שלך כאן ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'smai-snake-world';

        let user = null;
        let handLandmarker;
        let isMicOn = false;
        let audioContext, analyser, dataArray;
        let playerMeshes = {};
        
        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000500);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const grid = new THREE.GridHelper(100, 50, 0x00ff00, 0x002200);
        scene.add(grid);
        camera.position.set(0, 30, 30);
        camera.lookAt(0,0,0);

        let mySnakeData = { body: [], color: 0x00ff00 };

        // --- Auth & Sync ---
        async function initGame() {
            const u = await signInAnonymously(auth);
            user = u.user;
            setupSync();
            initVision();
            setupMic();
        }

        function setupSync() {
            const playersCol = collection(db, 'players');
            onSnapshot(playersCol, (snapshot) => {
                const currentIds = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    currentIds.push(data.uid);
                    updateSnakeMesh(data);
                });
                
                Object.keys(playerMeshes).forEach(uid => {
                    if (!currentIds.includes(uid)) {
                        scene.remove(playerMeshes[uid]);
                        delete playerMeshes[uid];
                    }
                });
                renderUI(snapshot);
            });
        }

        function updateSnakeMesh(data) {
            if (!playerMeshes[data.uid]) {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshPhongMaterial({ color: 0x00ff00 }));
                scene.add(mesh);
                playerMeshes[data.uid] = mesh;
            }
            playerMeshes[data.uid].position.set(data.x || 0, 1, data.z || 0);
        }

        async function initVision() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('hand-video').srcObject = stream;
            document.getElementById('webcam-preview').srcObject = stream;
            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            const video = document.getElementById('hand-video');
            if (video.readyState >= 2) {
                const detections = handLandmarker.detectForVideo(video, performance.now());
                if (detections.landmarks && detections.landmarks[0]) {
                    const x = (detections.landmarks[0][8].x - 0.5) * -60;
                    const z = (detections.landmarks[0][8].y - 0.5) * 60;
                    if (user) setDoc(doc(db, 'players', user.uid), { uid: user.uid, x, z, lastSeen: serverTimestamp() }, { merge: true });
                }
            }
            renderer.render(scene, camera);
            requestAnimationFrame(gameLoop);
        }

        function setupMic() {
            document.getElementById('mic-toggle').onclick = async () => {
                isMicOn = !isMicOn;
                document.getElementById('mic-icon').style.color = isMicOn ? "#4ade80" : "#ef4444";
                if (isMicOn) await navigator.mediaDevices.getUserMedia({ audio: true });
            };
        }

        function renderUI(snapshot) {
            const list = document.getElementById('players-list');
            list.innerHTML = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div>• ${d.uid === user.uid ? 'אני' : 'שחקן'}</div>`;
            });
        }

        initGame();
    </script>
</body>
</html>
